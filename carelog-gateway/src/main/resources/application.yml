spring:
  application:
    name: carelog-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    gateway:
      routes:
        - id: carelog-be
          uri: ${CARELOG_BE_URI}
          predicates:
            - Path=/api/**
        - id: carelog-rag
          uri: ${CARELOG_RAG_URI}
          predicates:
            - Path=/rag/**

server:
  port: ${GATEWAY_PORT:9000}

gateway:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/users/managers
    - /api/v1/swagger-ui
    - /api/v1/v3/api-docs
  internal-secret: ${GATEWAY_INTERNAL_SECRET}

jwt:
  secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    carelog.gateway: INFO