spring:
  application:
    name: carelog-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    gateway:
      routes:
        - id: kakao-oauth-authorization
          uri: ${CARELOG_BE_URI}
          order: -20
          predicates:
            - Path=/api/v1/auth/oauth/kakao/authorization
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@oauthClientIpKeyResolver}"
                rate-limiter: "#{@oauthFailClosedRateLimiter}"
                redis-rate-limiter.replenishRate: ${gateway.oauth-rate-limit.authorization.replenish-rate}
                redis-rate-limiter.burstCapacity: ${gateway.oauth-rate-limit.authorization.burst-capacity}
        - id: kakao-oauth-exchange
          uri: ${CARELOG_BE_URI}
          order: -20
          predicates:
            - Path=/api/v1/auth/oauth/kakao/exchange
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@oauthClientIpKeyResolver}"
                rate-limiter: "#{@oauthFailClosedRateLimiter}"
                redis-rate-limiter.replenishRate: ${gateway.oauth-rate-limit.exchange.replenish-rate}
                redis-rate-limiter.burstCapacity: ${gateway.oauth-rate-limit.exchange.burst-capacity}
        - id: carelog-be
          uri: ${CARELOG_BE_URI}
          order: 0
          predicates:
            - Path=/api/**
        - id: carelog-rag
          uri: ${CARELOG_RAG_URI}
          predicates:
            - Path=/rag/**

server:
  port: ${GATEWAY_PORT:9000}

gateway:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/users/managers
    - /api/v1/swagger-ui
    - /api/v1/v3/api-docs
  internal-secret: ${GATEWAY_INTERNAL_SECRET}
  oauth-rate-limit:
    # 이 Gateway 앞의 신뢰 가능한 proxy hop 수다. 운영 proxy 구성에 맞춰 반드시 조정한다.
    trusted-proxy-hops: ${OAUTH_RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
    authorization:
      replenish-rate: 5
      burst-capacity: 10
    exchange:
      replenish-rate: 3
      burst-capacity: 6

jwt:
  secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    carelog.gateway: INFO
