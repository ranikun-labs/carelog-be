name: "📝docs: 문서"
description: "문서 추가/수정"
title: "📝docs/<간단-설명>"
labels: ["type: docs"]
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: "문서 내용 요약"
      placeholder: "API 문서 업데이트, 가이드 보완 등"
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: "변경 사항"
      placeholder: |
        - [ ] 엔드포인트 설명 최신화
        - [ ] 예제 코드 추가
  - type: input
    id: branch
    attributes:
      label: "브랜치 이름(권장)"
      placeholder: "docs/update-api-docs"
