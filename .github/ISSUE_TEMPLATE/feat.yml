name: "✨feat: 새로운 기능"
description: "새로운 기능을 제안/추가합니다."
title: "✨feat/<간단-설명>"
labels: ["type: feat"]
assignees: []  # 예: ["ych1513"]
body:
  - type: input
    id: summary
    attributes:
      label: "요약"
      description: "무엇을 왜 추가하나요?"
      placeholder: "사용자 프로필 기능 추가"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "상세 설명"
      description: "기능 요구사항과 스펙"
      placeholder: |
        - 사용자는 프로필 편집 가능
        - 필수: 이름, 아바타
  - type: textarea
    id: acceptance
    attributes:
      label: "수용 기준 (Acceptance Criteria)"
      placeholder: |
        - [ ] 저장 성공/실패 토스트
        - [ ] 서버 검증 실패 메시지
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: "할 일 (Tasks)"
      placeholder: |
        - [ ] API 스펙
        - [ ] UI 구현
        - [ ] 테스트
  - type: input
    id: branch
    attributes:
      label: "브랜치 이름(권장)"
      placeholder: "feat/123-add-user-profile"
