name: "✨feat: 새로운 기능"
description: "새로운 기능을 제안/추가합니다."
title: "✨feat: <간단-설명>"
labels: ["type: feat"]
assignees: []
body:
  - type: textarea
    id: description
    attributes:
      label: "기능 설명 (Description)"
      description: "추가하려는 기능이 무엇인지, 왜 필요한지 설명해주세요."
      placeholder: |
        예: 사용자 도메인의 기반이 되는 User 엔티티와 Repository를 생성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "수용 기준 (Acceptance Criteria)"
      description: "기능이 올바르게 동작한다고 판단할 수 있는 기준을 명시합니다. (선택 사항)"
      placeholder: |
        - 예: API 호출 시 예상된 응답(201, 400 등)이 반환된다.
    validations:
      required: false
  - type: textarea
    id: tasks
    attributes:
      label: "할 일 (Tasks)"
      placeholder: |
        - [ ] Entity, DTO 작성
        - [ ] Repository 작성
        - [ ] Service 로직 구현
        - [ ] Controller 구현
        - [ ] 테스트 코드 작성
  - type: input
    id: branch
    attributes:
      label: "브랜치 이름(권장)"
      placeholder: "feat/123-add-user-entity"
