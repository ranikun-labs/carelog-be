name: "🐛fix: 버그 수정"
description: "버그를 보고하고 수정합니다."
title: "🐛fix/<간단-설명>"
labels: ["type: fix", "bug"]
assignees: []
body:
  - type: textarea
    id: bug
    attributes:
      label: "버그 설명"
      description: "현재 동작과 기대 동작을 비교해서 설명해주세요."
      placeholder: |
        현상: 로그인 버튼 클릭 시 500 에러
        기대: 정상 로그인 또는 오류 메시지
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "재현 절차"
      placeholder: |
        1) /login 페이지 접속
        2) 유효한 계정 입력
        3) Sign in 클릭 시 에러 발생
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "환경"
      placeholder: "OS/브라우저/앱 버전 등"
  - type: textarea
    id: tasks
    attributes:
      label: "할 일 (Tasks)"
      placeholder: |
        - [ ] 원인 파악
        - [ ] 수정 및 테스트
        - [ ] 회귀 테스트
  - type: input
    id: branch
    attributes:
      label: "브랜치 이름(권장)"
      placeholder: "fix/456-login-error"
