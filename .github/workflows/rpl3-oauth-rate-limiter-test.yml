name: RPL-3 OAuth Rate Limiter Targeted Test

on:
  push:
    branches:
      - feat/kakao-oauth-gateway-publication

permissions:
  contents: read

jobs:
  oauth-rate-limiter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run targeted OAuth rate limiter tests
        run: |
          ./gradlew :carelog-gateway:test --no-daemon --stacktrace --console=plain \
            --tests carelog.gateway.ratelimit.OAuthFailClosedRateLimiterTest \
            --tests carelog.gateway.route.OAuthGatewayRouteIntegrationTest \
            --tests carelog.gateway.route.OAuthGatewayRedisConnectionFailureRouteTest
