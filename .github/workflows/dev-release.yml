name: Carelog DEV release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      deploy_enabled:
        description: Deploy the published digest to DEV (false publishes only)
        type: boolean
        default: false
        required: true

permissions: {}

jobs:
  activation:
    if: github.repository == 'ranikun-labs/carelog-be' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check automatic release activation
        id: check
        env:
          AUTO_DEPLOY: ${{ vars.CARELOG_DEV_AUTO_DEPLOY }}
        run: |
          if [[ "$AUTO_DEPLOY" == 'true' ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: activation
    if: >-
      github.repository == 'ranikun-labs/carelog-be' && github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.activation.outputs.enabled == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Set Docker Java API compatibility for hosted Docker 29
        run: printf 'api.version=1.44\n' > "$HOME/.docker-java.properties"
      - name: Run Carelog backend tests
        run: ./gradlew :carelog-be:test --no-daemon --stacktrace --console=plain

  release:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ranikun-labs/platform-infra/.github/workflows/dev-ecs-release.yml@4cf8bfedd7454be3a314b22a165d2555fc096fe2
    with:
      service: carelog
      dockerfile: carelog-be/Dockerfile
      context: .
      deploy_enabled: ${{ github.event_name == 'push' || inputs.deploy_enabled == true }}
      test_sha: ${{ github.sha }}
      require_current_dev_tip: ${{ github.event_name == 'push' }}
