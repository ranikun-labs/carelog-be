name: RPL-55 manager registration and rollback targeted evidence
on:
  push:
    branches:
      - audit/rpl55-manager-registration-regression-20261023
permissions:
  contents: read
jobs:
  registration-login:
    name: Legacy Carelog manager registration/login compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify container engine before Spring Testcontainers
        shell: bash
        run: |
          set -euxo pipefail
          ls -l /var/run/docker.sock || true
          docker version
          docker info --format 'ServerVersion={{.ServerVersion}} OperatingSystem={{.OperatingSystem}}'
      - name: CI-only Docker 29 / Testcontainers 1.20 compatibility
        shell: bash
        run: |
          # Testcontainers 1.20.6 uses docker-java API 1.32 by default.
          # Docker 29.4.2 requires >= 1.40. Isolated CI only; do not
          # commit workaround to product test resources or change Docker daemon.
          printf 'api.version=1.44\n' > carelog-be/src/test/resources/docker-java.properties
          grep -qx 'api.version=1.44' carelog-be/src/test/resources/docker-java.properties
      - name: Legacy manager register and login (Testcontainers PostgreSQL)
        run: ./gradlew :carelog-be:test --tests 'carelog.carelog.identity.ManagerRegistrationAndLoginIntegrationTest*' --no-daemon --stacktrace --info
  rollback:
    name: Legacy Carelog manager registration atomic rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify container engine before Spring Testcontainers
        shell: bash
        run: |
          set -euxo pipefail
          ls -l /var/run/docker.sock || true
          docker version
          docker info --format 'ServerVersion={{.ServerVersion}} OperatingSystem={{.OperatingSystem}}'
      - name: CI-only Docker 29 / Testcontainers 1.20 compatibility
        shell: bash
        run: |
          # Testcontainers 1.20.6 uses docker-java API 1.32 by default.
          # Docker 29.4.2 requires >= 1.40. Isolated CI only; do not
          # commit workaround to product test resources or change Docker daemon.
          printf 'api.version=1.44\n' > carelog-be/src/test/resources/docker-java.properties
          grep -qx 'api.version=1.44' carelog-be/src/test/resources/docker-java.properties
      - name: Legacy manager rollback (Testcontainers PostgreSQL)
        run: ./gradlew :carelog-be:test --tests 'carelog.carelog.identity.ManagerRegistrationRollbackIntegrationTest' --no-daemon --stacktrace --info
