name: RPL-64 Carelog Customer API database integration

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/rpl64-customer-api-integration.yml
      - carelog-be/src/main/**
      - carelog-be/src/test/**
      - carelog-be/build.gradle
      - build.gradle
      - gradle/**
      - gradlew
      - settings.gradle
  push:
    branches:
      - codex/rpl64-carelog-be-api-integration-20261030

permissions:
  contents: read

jobs:
  customer-api-testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout backend PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout pinned Carelog FE #22 source
        uses: actions/checkout@v4
        with:
          repository: ranikun-labs/carelog-fe
          ref: 190c70564df5261b9a711b8e23cd7b457bbccbc9
          path: carelog-fe
          persist-credentials: false

      - name: Verify backend and frontend source SHAs
        env:
          EXPECTED_BACKEND_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EXPECTED_FRONTEND_SHA: 190c70564df5261b9a711b8e23cd7b457bbccbc9
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_BACKEND_SHA"
          test "$(git -C carelog-fe rev-parse HEAD)" = "$EXPECTED_FRONTEND_SHA"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set validated Docker Java API compatibility for hosted Docker 29
        run: printf 'api.version=1.44\n' > "$HOME/.docker-java.properties"

      - name: Set up pnpm 11.15.1
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: carelog-fe/pnpm-lock.yaml

      - name: Install pinned FE dependencies
        working-directory: carelog-fe
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and system dependencies
        working-directory: carelog-fe
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Customer and CustomerEvent PostgreSQL tests plus real FE HTTP readback
        env:
          CARELOG_FE_ROOT: ${{ github.workspace }}/carelog-fe
        run: >-
          ./gradlew :carelog-be:test
          --tests 'carelog.carelog.customer.CustomerProductApiIntegrationTest'
          --tests 'carelog.carelog.customerevent.CustomerEventProductApiIntegrationTest'
          --tests 'carelog.carelog.integration.CarelogFrontendHttpPostgresIntegrationTest'
          --no-daemon --stacktrace --console=plain
