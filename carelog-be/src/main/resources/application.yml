spring:
  application:
    name: carelog
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 신규 빈 DB는 V1부터 그대로 실행된다. 예상 못한 비어있지 않은 DB를 자동으로 V1 기준선 취급하지
    # 않도록 기본값은 false — 기존 운영/개발 DB를 유지해야 하는 환경에서만 명시적으로 opt-in한다.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
server:
  servlet:
    context-path: /api/v1
  # 내부 loopback 경계(carelog.internal.*loopback-only)의 전제: 원격 주소를 헤더로 복원하지 않는다.
  # 미설정 시 클라우드 플랫폼 감지로 헤더 신뢰가 켜질 수 있어 명시적으로 none을 둔다.
  forward-headers-strategy: none

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY}

carelog:
  internal:
    identity-claims:
      enabled: ${CARELOG_INTERNAL_IDENTITY_CLAIMS_ENABLED:false}
      service-secret: ${CARELOG_INTERNAL_IDENTITY_CLAIMS_SERVICE_SECRET:}
    # 내부 엔드포인트를 loopback 피어(8443 TLS sidecar)로만 허용한다. 기본 false.
    loopback-only:
      enabled: ${CARELOG_INTERNAL_LOOPBACK_ONLY_ENABLED:false}
    # claims만 별도 제어한다. 롤백 window 동안 구 Core(8080 http)가 claims를 호출하도록 false로 둘 수 있다.
    claims-loopback-only:
      enabled: ${CARELOG_INTERNAL_CLAIMS_LOOPBACK_ONLY_ENABLED:false}

oauth:
  state:
    ttl: 5m
  # provider + clientId callback URI. 기존 redirect-uris.<provider>.<channel>은 carelog-web/mobile에만 fallback으로 유지한다.
  provider-callbacks: {}
  redirect-uris: {}
  allowed-return-origins: []

springdoc:
  version: v1.0.0
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  level:
    carelog.carelog: INFO
    org.springframework.security: WARN
    org.hibernate.type.descriptor.sql: WARN
