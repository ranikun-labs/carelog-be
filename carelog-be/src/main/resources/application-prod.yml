spring:
  config:
    import: configtree:/run/secrets/
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}
      data-source-properties:
        sslmode: verify-full
        sslrootcert: /run/rds-ca.pem
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${CARELOG_FLYWAY_ENABLED:false}
    baseline-on-migrate: false
  data:
    redis:
      client-type: lettuce
      timeout: ${VALKEY_TIMEOUT:3s}
      connect-timeout: ${VALKEY_CONNECT_TIMEOUT:3s}
      ssl:
        enabled: ${VALKEY_TLS_ENABLED:true}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

carelog:
  internal:
    identity-claims:
      enabled: false
  security:
    swagger:
      public: false
    cors:
      allow-any-origin: false
      allowed-origins: ${CARELOG_CORS_ALLOWED_ORIGINS}
      allow-credentials: false
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept,X-Requested-With

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: ${CARELOG_MANAGEMENT_PORT:8081}
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      service: ${spring.application.name:carelog}
      environment: ${CARELOG_ENVIRONMENT:production}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name:carelog} env=${CARELOG_ENVIRONMENT:production} [%thread] %logger{36} - %msg%n%ex"
