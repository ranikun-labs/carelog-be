spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 테스트는 항상 신규 빈 Testcontainers DB를 사용한다 — V1부터 정상 실행되므로 baseline이 필요 없다.
    # Legacy Upgrade 시나리오는 IdentityFoundationMigrationTest가 Flyway Java API로 별도 검증한다.
    baseline-on-migrate: false
    baseline-version: 1
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret-key: test-signing-key-with-at-least-thirty-two-bytes-for-hs256
  access-token-validity: 3600000
  refresh-token-validity: 86400000

gateway:
  internal-secret: test-gateway-internal-secret
