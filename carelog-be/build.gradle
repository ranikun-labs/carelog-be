plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'carelog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit: Auth 내부 경계(Port/Adapter/Application) 의존 규칙을 테스트로 고정
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Jasypt
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

    // Springdoc (Swagger UI) - compatible with Spring Boot 3.4.x
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    // Hibernate Types for PostgreSQL JSONB support
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.9.0'

    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('bootJar') {
    archiveFileName = 'carelog.jar'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'rpl64-fe-http'
    }
}

tasks.register('rpl64FeHttpTest', Test) {
    description = 'Runs the RPL-64 FE production-adapter HTTP/PostgreSQL integration tests.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    outputs.upToDateWhen { false }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'rpl64-fe-http'
    }
    shouldRunAfter tasks.named('test')

    doFirst {
        def configuredFrontendRoot = System.getenv('CARELOG_FE_ROOT')
        if (configuredFrontendRoot == null || configuredFrontendRoot.isBlank()) {
            throw new GradleException('RPL-64 requires CARELOG_FE_ROOT pointing to the pinned Carelog FE checkout at 190c70564df5261b9a711b8e23cd7b457bbccbc9.')
        }

        def frontendRoot = file(configuredFrontendRoot).canonicalFile
        if (!frontendRoot.isDirectory()) {
            throw new GradleException("RPL-64 CARELOG_FE_ROOT is not a directory: ${frontendRoot}")
        }
        if (!new File(frontendRoot, 'node_modules').isDirectory()) {
            throw new GradleException("RPL-64 FE dependencies are missing under ${frontendRoot}; run pnpm install for the pinned checkout.")
        }

        def expectedFrontendSha = '190c70564df5261b9a711b8e23cd7b457bbccbc9'
        def gitProcess = new ProcessBuilder('git', '-C', frontendRoot.absolutePath, 'rev-parse', 'HEAD')
                .redirectErrorStream(true)
                .start()
        def frontendSha = gitProcess.inputStream.getText('UTF-8').trim()
        if (gitProcess.waitFor() != 0) {
            frontendSha = System.getenv('CARELOG_RPL64_FE_SOURCE_SHA')
        }
        if (frontendSha == null || frontendSha.isBlank()) {
            throw new GradleException("RPL-64 could not read the FE source SHA from ${frontendRoot}; provide a Git checkout or CARELOG_RPL64_FE_SOURCE_SHA for a verified source snapshot.")
        }
        if (frontendSha != expectedFrontendSha) {
            throw new GradleException("RPL-64 requires FE source ${expectedFrontendSha}, but CARELOG_FE_ROOT is at ${frontendSha}.")
        }
    }
}
